<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">Piscineros</h3>
          <p class="text-center text-muted mb-4">Inicia sesión en tu cuenta</p>

          <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
            
            <!-- Campo Correo -->
            <div class="mb-3">
              <label class="form-label">Usuario o Correo</label>
              <input type="text" class="form-control" formControlName="email" placeholder="ejemplo (o ejemplo@piscineros.cl)">
            </div>

            <!-- Campo Contraseña -->
            <div class="mb-4">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" formControlName="password" placeholder="********">
            </div>

            <!-- Botón Submit -->
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="formulario.invalid || cargando">
                @if (cargando) {
                  <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                  <span role="status"> Cargando...</span>
                } @else {
                  Ingresar
                }
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
