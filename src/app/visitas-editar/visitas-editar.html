<div class="card mt-4" style="max-width: 600px; margin: 0 auto;">
  <div class="card-header bg-warning text-dark">
    <h4 class="mb-0">Actualizar Estado de Visita</h4>
  </div>
  <div class="card-body">
    
    <form [formGroup]="formulario" (ngSubmit)="actualizar()">
      
      <!-- Selector de Estados -->
      <div class="mb-3">
        <label class="form-label">Estado de la Visita</label>
        <select class="form-select" formControlName="estado">
          <option value="" disabled selected>Seleccione el estado actual...</option>
          @for (estado of estados; track estado.id) {
            <option [value]="estado.id">{{ estado.nombre }}</option>
          }
        </select>
      </div>

      <!-- Selector de Técnicos (Por si cambian al responsable) -->
      <div class="mb-3">
        <label class="form-label">Técnico Asignado</label>
        <select class="form-select" formControlName="tecnicoId">
          <option value="" disabled selected>Cargando técnicos...</option>
          @for (tecnico of tecnicos; track tecnico.id) {
            <option [value]="tecnico.id">{{ tecnico.nombre }} {{ tecnico.apellido }}</option>
          }
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Observaciones del Mantenimiento</label>
        <textarea class="form-control" rows="4" formControlName="observaciones" 
                  placeholder="Ej: Se limpiaron los filtros y se ajustó el pH a 7.4"></textarea>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-secondary" (click)="volver()">Cancelar</button>
        <button type="submit" class="btn btn-warning" [disabled]="formulario.invalid">
          Guardar Cambios
        </button>
      </div>

    </form>

  </div>
</div>
