<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Directorio de Técnicos</h2>
    <a routerLink="/tecnicos/nuevo" class="btn btn-primary">+ Nuevo Técnico</a>
  </div>

  <div *ngIf="cargando" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div *ngIf="!cargando && tecnicos.length === 0" class="alert alert-info">
    No hay técnicos registrados en el sistema.
  </div>

  <div *ngIf="!cargando && tecnicos.length > 0" class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Nombre</th>
            <th>RUT</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th class="text-center">Técnico Externo</th>
            <th class="text-center">Activo</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let tecnico of tecnicos">
            <td class="fw-bold">{{ tecnico.nombre }}</td>
            <td>{{ tecnico.rut }}</td>
            <td>{{ tecnico.telefono }}</td>
            <td>{{ tecnico.correo }}</td>
            <td class="text-center">
              <div class="form-check form-switch d-inline-block">
                <input class="form-check-input" type="checkbox" [(ngModel)]="tecnico.esExterno" (change)="toggleEsExterno(tecnico)">
              </div>
            </td>
            <td class="text-center">
              <div class="form-check form-switch d-inline-block">
                <input class="form-check-input" type="checkbox" [(ngModel)]="tecnico.activo" (change)="toggleActivo(tecnico)">
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
