<div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Listado de Clientes</h3>
    <button class="btn btn-primary" (click)="irANuevoCliente()">+ Nuevo Cliente</button>
  </div>
  
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Comuna</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (cliente of clientes; track cliente.id) {
        <tr>
          <td>{{ cliente.id }}</td>
          <td>{{ cliente.nombre }}</td>
          <td>{{ cliente.direccion }}</td>
          <td>{{ cliente.comuna }}</td>
          <td>
            <button class="btn btn-sm btn-danger" (click)="eliminar(cliente.id, cliente.nombre)">
              Eliminar
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="text-center text-muted">Cargando clientes o sin datos...</td>
        </tr>
      }
    </tbody>
  </table>
</div>
