<main class="container mt-4">
  <h1 class="text-primary">🏊‍♂️ Plataforma Piscineros</h1>
  <hr>
  
  <h3>Listado de Clientes</h3>
  
  <table class="table table-striped table-hover mt-3">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Comuna</th>
      </tr>
    </thead>
    <tbody>
      <!-- Recorremos la variable clientes que llenamos en app.ts -->
      @for (cliente of clientes; track cliente.id) {
        <tr>
          <td>{{ cliente.id }}</td>
          <td>{{ cliente.nombre }}</td>
          <td>{{ cliente.direccion }}</td>
          <td>{{ cliente.comuna }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="text-center text-muted">Cargando clientes o sin datos...</td>
        </tr>
      }
    </tbody>
  </table>

  <router-outlet></router-outlet>
</main>
