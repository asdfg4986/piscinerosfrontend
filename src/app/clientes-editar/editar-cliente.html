<div class="card mt-4" style="max-width: 600px; margin: 0 auto;">
  <div class="card-header bg-warning text-dark">
    <h4 class="mb-0">Editar Cliente</h4>
  </div>
  <div class="card-body">
    
    <form [formGroup]="formulario" (ngSubmit)="actualizar()">
      
      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" formControlName="nombre">
      </div>

      <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input type="text" class="form-control" formControlName="direccion">
      </div>

      <div class="mb-3">
        <label class="form-label">Comuna</label>
        <select class="form-select" formControlName="comuna">
          <option value="" disabled selected>Seleccione una comuna...</option>
    
          <!-- Recorremos el arreglo de comunas que trajimos de C# -->
          @for (comuna of comunas; track comuna.id) {
            <option [value]="comuna.nombre">{{ comuna.nombre }}</option>
          }
    
        </select>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="activoCheck" formControlName="activo">
        <label class="form-check-label" for="activoCheck">Cliente Activo</label>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn btn-warning" [disabled]="formulario.invalid">Actualizar Cliente</button>
      </div>

    </form>

  </div>
</div>
